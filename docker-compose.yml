name: blockchain-secure-platform-local

services:
  postgres:
    image: postgres@sha256:e17e86066e5ef83e0952a9347f5c792b7ece00972e2aa787a6986f471b3dd3d5
    environment:
      POSTGRES_DB: platform_projection_local
      POSTGRES_USER: platform_local
      POSTGRES_PASSWORD: local-development-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform_local -d platform_projection_local"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_local_data:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+psycopg://platform_local:local-development-only@postgres:5432/platform_projection_local?sslmode=disable
      DATABASE_SSL_MODE: disable
    command:
      - /bin/sh
      - -ec
      - |
        for attempt in 1 2 3 4 5; do
          alembic -c services/persistence/alembic.ini upgrade head && exit 0
          echo "migration attempt $${attempt} failed; retrying local PostgreSQL connection"
          sleep 2
        done
        exit 1
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      APP_ENV: local
      CHAIN_ID: "31337"
      RPC_URL: http://127.0.0.1:8545
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: postgresql+psycopg://platform_local:local-development-only@postgres:5432/platform_projection_local?sslmode=disable
      DATABASE_SSL_MODE: disable
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).read()"]
      interval: 10s
      timeout: 5s
      retries: 6

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  postgres_local_data:
    name: blockchain-secure-platform-local-postgres
