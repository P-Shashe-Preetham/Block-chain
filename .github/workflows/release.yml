name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Semantic release
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner != '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx --yes \
            --package semantic-release@24 \
            --package @semantic-release/changelog@6 \
            --package @semantic-release/commit-analyzer@13 \
            --package @semantic-release/git@10 \
            --package @semantic-release/github@11 \
            --package @semantic-release/npm@12 \
            --package @semantic-release/release-notes-generator@14 \
            semantic-release
