name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
          POSTGRES_DB: platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U platform -d platform"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      NODE_ENV: test
      APP_ENV: ci
      CHAIN_ID: 31337
      RPC_URL: http://127.0.0.1:8545
      DATABASE_URL: postgresql://platform:platform@localhost:5432/platform
      REDIS_URL: redis://localhost:6379/0
      SESSION_SECRET: ci-only-not-for-production
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        if: ${{ hashFiles('package.json') != '' || hashFiles('pnpm-workspace.yaml') != '' }}
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.21.0

      - name: Set up Node.js
        if: ${{ hashFiles('package.json') != '' || hashFiles('pnpm-workspace.yaml') != '' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install JavaScript dependencies
        if: ${{ hashFiles('package.json') != '' || hashFiles('pnpm-workspace.yaml') != '' }}
        run: pnpm install --frozen-lockfile

      - name: Validate curated repository references
        if: ${{ hashFiles('package.json') != '' }}
        run: pnpm validate:references

      - name: Validate environment contract
        if: ${{ hashFiles('package.json') != '' && hashFiles('config/environment.schema.json') != '' }}
        run: pnpm validate:environment -- --file .env.example --environment local

      - name: Audit dependencies
        if: ${{ hashFiles('package.json') != '' }}
        run: pnpm audit --audit-level=moderate

      - name: Lint JavaScript and TypeScript
        if: ${{ hashFiles('package.json') != '' || hashFiles('pnpm-workspace.yaml') != '' }}
        run: pnpm lint

      - name: Test contracts and JavaScript packages
        if: ${{ hashFiles('package.json') != '' || hashFiles('pnpm-workspace.yaml') != '' }}
        run: pnpm test

      - name: Test Python services
        if: ${{ hashFiles('services/api/tests/**/*.py') != '' || hashFiles('tests/**/*.py') != '' }}
        run: python -m pytest

      - name: Build application
        if: ${{ hashFiles('package.json') != '' || hashFiles('pnpm-workspace.yaml') != '' }}
        run: pnpm build

      - name: Validate YAML and JSON configuration
        run: |
          if command -v ruby >/dev/null 2>&1; then
            find .github .devcontainer -type f \( -name '*.yml' -o -name '*.yaml' -o -name '*.json' \) -print0 | xargs -0 -r -n1 ruby -e 'require "yaml"; YAML.load_file(ARGV[0])' \
              || { echo "Configuration parsing failed"; exit 1; }
          else
            echo "Ruby unavailable; configuration parsing is delegated to repository tooling."
          fi
